name: mapalab-dev
services:
  frontend:
    image: mapalab-frontend-dev:${IMAGE_TAG:-latest}
    container_name: mapalab-frontend-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.development
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./index.html:/app/index.html:ro
      - ./vite.config.js:/app/vite.config.js:ro
      - ./vitest.config.js:/app/vitest.config.js:ro
      - mapalab-frontend-node-modules:/app/node_modules
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${FRONTEND_PORT:-${VITE_PORT:-5173}}:${VITE_PORT:-5173}'
    networks:
      - mapalab-network
    restart: unless-stopped

volumes:
  mapalab-frontend-node-modules:
    name: mapalab-frontend-node-modules

networks:
  mapalab-network:
    name: ${NETWORK_NAME:-mapalab-network}
    external: true
