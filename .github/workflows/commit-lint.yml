name: Validate Commits
on: [pull_request]
jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Validate Conventional Commits
        run: |
          # Solo validar los commits del pull request
          commits=$(git log --format=%s origin/${{ github.base_ref }}..HEAD)
          
          regex="^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9\-]+\))?: .+"
          error=0
          
          while read -r msg; do
            if echo "$msg" | grep -q "^Merge branch"; then
              continue
            fi
            if [[ ! "$msg" =~ $regex ]]; then
              echo "❌ El mensaje no sigue Conventional Commits: '$msg'"
              error=1
            else
              echo "✅ Valido: '$msg'"
            fi
          done <<< "$commits"
          
          if [ $error -eq 1 ]; then
            echo ""
            echo "Asegurate de usar el formato: <tipo>[(ambito opcional)]: <descripcion>"
            echo "Tipos: build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test"
            echo "Ambitos comunes (opcional): auth, map, ui, backend, frontend, db, api, etc."
            echo ""
            echo "Ejemplo valido sin ambito: feat: add login form"
            echo "Ejemplo valido con ambito: feat(auth): add login form"
            exit 1
          fi
