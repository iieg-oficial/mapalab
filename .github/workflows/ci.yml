name: CI

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.gitignore', 'LICENSE']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alcance:
    runs-on: [self-hosted, linux, iieg]
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      frontend: ${{ steps.carpetas.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: carpetas
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/carpetas-cambiadas.sh frontend

  test:
    needs: alcance
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/test-frontend.yml
    with:
      correr: ${{ needs.alcance.outputs.frontend != 'false' }}
