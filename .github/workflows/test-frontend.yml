name: Test Frontend

on:
  workflow_call:

jobs:
  test:
    runs-on: [self-hosted, linux, iieg]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Lint
        working-directory: ./frontend
        run: npm run lint
      - name: Test (with coverage thresholds)
        working-directory: ./frontend
        run: npm run test:coverage
      - name: Dead code check
        working-directory: ./frontend
        run: npm run check:dead-code:strict
      - name: Build
        working-directory: ./frontend
        run: npm run build
      - name: Navegador para el smoke test
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - name: Smoke test del bundle
        working-directory: ./frontend
        run: npm run smoke
