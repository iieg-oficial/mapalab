name: Test Frontend

on:
  workflow_call:
    inputs:
      correr:
        description: 'false salta los tests (no cambió frontend/ o ya corren en el PR)'
        required: false
        type: boolean
        default: true

jobs:
  test:
    if: ${{ inputs.correr }}
    runs-on: [self-hosted, linux, iieg]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Restaurar node_modules
        id: nm
        working-directory: ./frontend
        env:
          LLAVE: ${{ github.event.repository.name }}-frontend-node26-${{ hashFiles('frontend/package-lock.json') }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/node-modules.sh" restaurar "$LLAVE"
      - name: Install dependencies
        if: steps.nm.outputs.hit != 'true'
        working-directory: ./frontend
        run: npm ci
      - name: Guardar node_modules
        if: steps.nm.outputs.hit != 'true'
        working-directory: ./frontend
        env:
          LLAVE: ${{ github.event.repository.name }}-frontend-node26-${{ hashFiles('frontend/package-lock.json') }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/node-modules.sh" guardar "$LLAVE"
      - name: Lint
        working-directory: ./frontend
        run: npm run lint
      - name: Test (with coverage thresholds)
        working-directory: ./frontend
        run: npm run test:coverage
      - name: Dead code check
        working-directory: ./frontend
        run: npm run check:dead-code:strict
      - name: Build
        working-directory: ./frontend
        run: npm run build
      - name: Navegador para el smoke test
        working-directory: ./frontend
        run: npx playwright install chromium
      - name: Smoke test del bundle
        working-directory: ./frontend
        run: npm run smoke
