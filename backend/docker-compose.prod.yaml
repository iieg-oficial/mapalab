name: mapalab
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - mapalab-network
    restart: always

networks:
  mapalab-network:
    name: ${NETWORK_NAME:-mapalab-network}
    external: true
