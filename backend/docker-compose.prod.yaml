name: mapalab
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    command: uvicorn app.server:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000}
    networks:
      - mapalab-network
    restart: always

networks:
  mapalab-network:
    name: ${NETWORK_NAME:-mapalab-network}
    external: true
