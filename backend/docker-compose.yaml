name: mapalab-backend
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: uvicorn app.server:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000} --reload
    networks:
      - mapalab-network
    restart: unless-stopped

networks:
  mapalab-network:
    name: ${NETWORK_NAME:-mapalab-network}
    external: true
