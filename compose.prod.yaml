name: mapalab

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-vite-args: &vite-args
  VITE_BASE_PATH: ${VITE_BASE_PATH:?}
  VITE_BACKEND_API_HOST: ${VITE_BACKEND_API_HOST:?}
  VITE_GEOSERVER_URL: ${VITE_GEOSERVER_URL:?}
  VITE_SITE_URL: ${VITE_SITE_URL?}
  VITE_NODE_ENV: ${VITE_NODE_ENV:?}
  VITE_APP_ENV: ${VITE_APP_ENV:?}
  VITE_COLIBRI_SOURCE_APP: ${VITE_COLIBRI_SOURCE_APP:?}
  VITE_COLIBRI_API_KEY: ${VITE_COLIBRI_API_KEY?}
  VITE_CARTO_API_KEY: ${VITE_CARTO_API_KEY?}
  VITE_ACERVO_ORIGIN: ${VITE_ACERVO_ORIGIN?}

services:
  backend:
    build:
      target: production
    networks:
      - default
      - iieg-network
    restart: unless-stopped

  mapalab-mcp:
    build:
      target: production
    networks:
      - default
      - iieg-network
    restart: unless-stopped

  docker-socket-proxy:
    image: nginx:1.30.4-alpine
    container_name: mapalab-docker-socket-proxy
    user: "101:101"
    group_add:
      - ${DOCKER_GID:?}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./version-api/docker-proxy.conf:/etc/nginx/nginx.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    restart: unless-stopped
    logging: *logging

  version-api:
    build: ./version-api
    container_name: mapalab-version-api
    environment:
      ONTOY_SERVICE: mapalab
      ONTOY_NODE: ${ONTOY_NODE:?}
      ONTOY_NODE_REPORTER: ${ONTOY_NODE_REPORTER:?}
      ONTOY_PEER_CHECKS: ${ONTOY_PEER_CHECKS}
      ONTOY_COMPOSE_PROJECT: mapalab
      ONTOY_DISK_PATH: ${ONTOY_DISK_PATH:?}
      ONTOY_UPSTREAM_URL: http://backend:${BACKEND_PORT:?}/ontoy
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      - /etc/os-release:/host/etc/os-release:ro
    depends_on:
      - docker-socket-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8088), timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      - iieg-network
      - docker-api
    restart: unless-stopped
    logging: *logging

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args: *vite-args
    ports:
      - "${NGINX_BIND_ADDR:?}:${NGINX_PORT:?}:80"
    depends_on:
      backend:
        condition: service_healthy
      mapalab-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      - iieg-network
    restart: unless-stopped
    logging: *logging

networks:
  iieg-network:
    external: true
  docker-api:
    name: mapalab-docker-api
    internal: true
