map $http_x_real_ip $mapalab_real_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}

map $http_x_forwarded_proto $mapalab_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream mapalab_mcp {
    server mapalab-mcp:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10M;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|otf)$ {
            access_log off;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location = /error-recovery.js {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-cache";
        }
    }

    location = /__embed_marco {
        internal;
        proxy_pass http://backend/embed/marco;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $mapalab_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /embed {
        auth_request /__embed_marco;
        auth_request_set $embed_frame_ancestors $upstream_http_x_embed_frame_ancestors;
        try_files /index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
        add_header Content-Security-Policy $embed_frame_ancestors always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /mapalab/embed {
        auth_request /__embed_marco;
        auth_request_set $embed_frame_ancestors $upstream_http_x_embed_frame_ancestors;
        try_files /index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
        add_header Content-Security-Policy $embed_frame_ancestors always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /widget/ {
        alias /usr/share/nginx/html/widget/;
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /mapalab/widget/ {
        alias /usr/share/nginx/html/widget/;
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /mapalab/api/download/ {
        proxy_pass http://backend/download/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $mapalab_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location = /mapalab/mcp {
        limit_req zone=mcp_req burst=20 nodelay;
        limit_conn mcp_conn 10;
        client_max_body_size 256k;
        proxy_pass http://mapalab_mcp/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $mapalab_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /mapalab/mcp/ {
        limit_req zone=mcp_req burst=20 nodelay;
        limit_conn mcp_conn 10;
        client_max_body_size 256k;
        proxy_pass http://mapalab_mcp/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $mapalab_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /ontoy {
        set $mapalab_ontoy_upstream "mapalab-version-api:8088";
        proxy_pass http://$mapalab_ontoy_upstream/ontoy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /api/ontoy {
        deny all;
        return 403;
    }

    location = /mapalab/api/ontoy {
        deny all;
        return 403;
    }

    location /mapalab/api/ {
        proxy_pass http://backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $mapalab_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mapalab_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ^~ /mapalab/assets/ {
        alias /usr/share/nginx/html/assets/;
        try_files $uri =404;
        expires 1y;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, immutable";
    }

    location = /mapalab/error-recovery.js {
        alias /usr/share/nginx/html/error-recovery.js;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache";
    }

    location /mapalab/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        location ~* /mapalab/.*\.(png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            access_log off;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, immutable";
        }
    }

    location /api/download/ {
        proxy_pass http://backend/download/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $mapalab_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location = /mcp {
        limit_req zone=mcp_req burst=20 nodelay;
        limit_conn mcp_conn 10;
        client_max_body_size 256k;
        proxy_pass http://mapalab_mcp/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $mapalab_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /mcp/ {
        limit_req zone=mcp_req burst=20 nodelay;
        limit_conn mcp_conn 10;
        client_max_body_size 256k;
        proxy_pass http://mapalab_mcp/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $mapalab_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/ {
        proxy_pass http://backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $mapalab_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
