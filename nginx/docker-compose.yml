name: mapalab

services:
  nginx:
    build:
      context: .
    env_file:
      - .env
    ports:
      - '${NGINX_PORT:-80}:80'
    volumes:
      # Mount frontend build output
      - ../frontend/dist:/usr/share/nginx/html:ro
    networks:
      - mapalab-network
    restart: unless-stopped

networks:
  mapalab-network:
    name: ${NETWORK_NAME:-mapalab-network}
    external: true
