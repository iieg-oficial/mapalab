upstream geoserver {
    server ${GEOSERVER_HOST};
    keepalive 16;
}

map $arg_REQUEST $geoserver_cache_control {
    GetLegendGraphic "public, max-age=3600";
    default           "no-store";
}

limit_req_zone $binary_remote_addr zone=geoserver_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=geoserver_download:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=geoserver_conn:10m;
