upstream geoserver {
    server ${GEOSERVER_HOST};
    keepalive 64;
    keepalive_requests 1000;
}

map $arg_request $geoserver_no_cache {
    default         0;
    ~*GetFeatureInfo 1;
    ~*GetCapabilities 1;
    ~*DescribeFeatureType 1;
}

limit_req_zone $binary_remote_addr zone=geoserver_download:10m rate=10r/s;
