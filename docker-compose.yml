services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    profiles: ["dev"]
    init: true
    environment:
      VITE_BACKEND_API_HOST: ${VITE_BACKEND_API_HOST:?}
      VITE_GEOSERVER_URL: ${VITE_GEOSERVER_URL:?}
      VITE_ACERVO_ORIGIN: ${VITE_ACERVO_ORIGIN}
      VITE_NODE_ENV: ${VITE_NODE_ENV:?}
      VITE_APP_ENV: ${VITE_APP_ENV:?}
      VITE_PORT: ${VITE_PORT:?}
      VITE_SITE_URL: ${VITE_SITE_URL}
      VITE_BASE_PATH: ${VITE_BASE_PATH:?}
      VITE_COLIBRI_SOURCE_APP: ${VITE_COLIBRI_SOURCE_APP:?}
      VITE_COLIBRI_API_KEY: ${VITE_COLIBRI_API_KEY}
      GEOSERVER_DEV_TARGET: ${GEOSERVER_DEV_TARGET}
      BACKEND_DEV_TARGET: ${BACKEND_DEV_TARGET}
      MARIACHI_DEV_TARGET: ${MARIACHI_DEV_TARGET}
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.js:/app/vite.config.js:ro
      - ./frontend/vitest.config.js:/app/vitest.config.js:ro
      - frontend-node-modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:?}:${VITE_PORT:?}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${VITE_PORT:?}/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend-build:
    build:
      context: ./frontend
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:?}
        VITE_BACKEND_API_HOST: ${VITE_BACKEND_API_HOST:?}
        VITE_GEOSERVER_URL: ${VITE_GEOSERVER_URL:?}
        VITE_SITE_URL: ${VITE_SITE_URL}
        VITE_NODE_ENV: ${VITE_NODE_ENV:?}
        VITE_APP_ENV: ${VITE_APP_ENV:?}
        VITE_COLIBRI_SOURCE_APP: ${VITE_COLIBRI_SOURCE_APP:?}
        VITE_COLIBRI_API_KEY: ${VITE_COLIBRI_API_KEY}
        VITE_ACERVO_ORIGIN: ${VITE_ACERVO_ORIGIN}
    profiles: ["build"]
    user: "${UID:?}:${GID:?}"
    volumes:
      - ./frontend/dist:/output
    entrypoint: ["sh", "-c", "rm -rf /output/* && cp -r /app/dist/* /output/"]

  backend:
    build:
      context: ./backend
      target: ${BACKEND_TARGET:?}
    init: true
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?}
      DEBUG: ${DEBUG:?}
      CORS_ORIGINS: ${CORS_ORIGINS:?}
      LOG_LEVEL: ${LOG_LEVEL:?}
      BACKEND_PORT: ${BACKEND_PORT:?}
      GEOSERVER_URL: ${GEOSERVER_URL}
      GEOSERVER_USER: ${GEOSERVER_USER}
      GEOSERVER_PASSWORD: ${GEOSERVER_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:?}
      DB_NAME: ${DB_NAME}
      ACERVO_PUBLIC_URL: ${ACERVO_PUBLIC_URL}
      ACERVO_ENDPOINT: ${ACERVO_ENDPOINT}
      ACERVO_PUBLIC_ENDPOINT: ${ACERVO_PUBLIC_ENDPOINT}
      ACERVO_ACCESS_KEY: ${ACERVO_ACCESS_KEY}
      ACERVO_SECRET_KEY: ${ACERVO_SECRET_KEY}
      ACERVO_BUCKET: ${ACERVO_BUCKET}
      ACERVO_PRESIGN_TTL_SECONDS: ${ACERVO_PRESIGN_TTL_SECONDS}
      DOWNLOAD_CACHE_TTL_HOURS: ${DOWNLOAD_CACHE_TTL_HOURS}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:?}
      DB_POOL_SIZE: ${DB_POOL_SIZE:?}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:?}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:?}
      DB_STATEMENT_TIMEOUT_SECONDS: ${DB_STATEMENT_TIMEOUT_SECONDS:?}
      CLIENT_ERROR_WINDOW_MINUTES: ${CLIENT_ERROR_WINDOW_MINUTES:?}
      CLIENT_ERROR_WARN_COUNT: ${CLIENT_ERROR_WARN_COUNT:?}
      EMBED_ABUSE_WINDOW_MINUTES: ${EMBED_ABUSE_WINDOW_MINUTES:?}
      EMBED_ABUSE_WARN_COUNT: ${EMBED_ABUSE_WARN_COUNT:?}
      MAPALAB_INTERNAL_TOKEN: ${MAPALAB_INTERNAL_TOKEN}
      MARIACHI_BACKEND_URL: ${MARIACHI_BACKEND_URL}
      MARIACHI_VERIFY_SSL: ${MARIACHI_VERIFY_SSL:?}
      EMBED_KEY_CACHE_TTL_SECONDS: ${EMBED_KEY_CACHE_TTL_SECONDS:?}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BACKEND_PORT:?}/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - default
      - iieg-network
    restart: unless-stopped

  mapalab-mcp:
    build:
      context: .
      dockerfile: servers/Dockerfile
      target: ${BACKEND_TARGET:?}
    init: true
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?}
      DEBUG: ${DEBUG:?}
      LOG_LEVEL: ${LOG_LEVEL:?}
      GEOSERVER_URL: ${GEOSERVER_URL}
      GEOSERVER_USER: ${GEOSERVER_USER}
      GEOSERVER_PASSWORD: ${GEOSERVER_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:?}
      DB_NAME: ${DB_NAME}
      DB_POOL_SIZE: ${MCP_DB_POOL_SIZE:?}
      DB_MAX_OVERFLOW: ${MCP_DB_MAX_OVERFLOW:?}
      MCP_WORKERS: ${MCP_WORKERS:?}
      ACERVO_PUBLIC_URL: ${ACERVO_PUBLIC_URL}
      MAPALAB_INTERNAL_TOKEN: ${MAPALAB_INTERNAL_TOKEN}
      MARIACHI_BACKEND_URL: ${MARIACHI_BACKEND_INTERNAL_URL:?}
      MARIACHI_VERIFY_SSL: ${MARIACHI_VERIFY_SSL:?}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:?}
      DB_STATEMENT_TIMEOUT_SECONDS: ${DB_STATEMENT_TIMEOUT_SECONDS:?}
      MAPALAB_PUBLIC_BASE_URL: ${MAPALAB_PUBLIC_BASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - default
      - iieg-network
    restart: unless-stopped

  version-api:
    build: ./version-api
    container_name: mapalab-version-api
    profiles: ["prod"]
    environment:
      ONTOY_SERVICE: mapalab
      ONTOY_COMPOSE_PROJECT: mapalab
      ONTOY_DISK_PATH: ${ONTOY_DISK_PATH:?}
      ONTOY_UPSTREAM_URL: http://backend:${BACKEND_PORT:?}/ontoy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8088), timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      - iieg-network
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:?}
        VITE_BACKEND_API_HOST: ${VITE_BACKEND_API_HOST:?}
        VITE_GEOSERVER_URL: ${VITE_GEOSERVER_URL:?}
        VITE_SITE_URL: ${VITE_SITE_URL}
        VITE_NODE_ENV: ${VITE_NODE_ENV:?}
        VITE_APP_ENV: ${VITE_APP_ENV:?}
        VITE_COLIBRI_SOURCE_APP: ${VITE_COLIBRI_SOURCE_APP:?}
        VITE_COLIBRI_API_KEY: ${VITE_COLIBRI_API_KEY}
        VITE_ACERVO_ORIGIN: ${VITE_ACERVO_ORIGIN}
    profiles: ["prod"]
    ports:
      - "${NGINX_PORT:?}:80"
    depends_on:
      backend:
        condition: service_healthy
      mapalab-mcp:
        condition: service_healthy
    networks:
      - default
      - iieg-network
    restart: unless-stopped

volumes:
  frontend-node-modules:

networks:
  default:
    name: mapalab-network
  iieg-network:
    external: true
